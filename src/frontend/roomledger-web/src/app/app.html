<header>
  @if (isAuthenticated$ | async; as authState) {
    @if (authState.isAuthenticated) {
      <span>Authenticated</span>
      <button (click)="auth.logout()">Logout</button>
    } @else {
      <span>Not authenticated</span>
      <button (click)="auth.login()">Login with Cognito</button>
    }
  }
</header>

<main>
  <router-outlet />
</main>
