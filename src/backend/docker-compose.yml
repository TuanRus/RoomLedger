# PostgreSQL chạy trên máy cá nhân để code, chạy migration và test tích hợp.
# Không dùng cho dev/demo trên AWS (RDS dùng IAM auth, không có mật khẩu trong code).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roomledger
    ports:
      - "5432:5432"
    volumes:
      - roomledger-db:/var/lib/postgresql/data

volumes:
  roomledger-db:
