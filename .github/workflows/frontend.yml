name: frontend

on:
  pull_request:
    branches: [develop, main]
    paths: ["src/frontend/**"]
  push:
    branches: [develop, main]
    paths: ["src/frontend/**"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
